<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>삼치리 - 평택고등학교 63회</title>
    <!-- 예쁜 분필/손글씨 폰트 불러오기 -->
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #2b3e32;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Nanum Pen Script', cursive, sans-serif;
        }

        /* 칠판 프레임 */
        .blackboard-frame {
            background-color: #1e3328;
            border: 12px solid #8B4513;
            border-radius: 6px;
            width: 94vw;
            max-width: 1000px;
            height: 85vh;
            max-height: 600px;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 0 50px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* 칠판 가루 질감 오버레이 */
        .blackboard-frame::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0.1) 100%);
            pointer-events: none;
        }

        /* 중앙 컨테이너 */
        .center-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            z-index: 1;
            width: 100%;
        }

        /* 판서 애니메이션 */
        .center-content h1 {
            font-size: clamp(5rem, 15vw, 9rem);
            color: #f7f9f6;
            font-weight: normal;
            text-shadow: 
                0 0 2px rgba(255, 255, 255, 0.8),
                2px 2px 5px rgba(0, 0, 0, 0.5),
                0 0 15px rgba(255, 255, 255, 0.4);
            letter-spacing: 8px;
            margin-bottom: 25px;
            white-space: nowrap;
            opacity: 0;
            transform: scale(0.95);
            animation: chalkDraw 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes chalkDraw {
            0% { opacity: 0; transform: scale(0.9) translateY(10px); filter: blur(4px); }
            100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0px); }
        }

        /* 버튼 영역 */
        .auth-buttons {
            display: flex;
            gap: 15px;
            opacity: 0;
            animation: fadeIn 0.8s ease-in-out 0.8s forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-buttons button {
            background: transparent;
            color: #ffffff;
            font-family: 'Nanum Pen Script', cursive;
            font-size: clamp(1.2rem, 4vw, 1.5rem);
            border: 2px dashed rgba(255, 255, 255, 0.6);
            padding: 6px 20px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
        }

        .auth-buttons button:hover {
            background-color: rgba(255, 255, 255, 0.15);
            border-style: solid;
        }

        /* 팝업 모달창 공통 스타일 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .modal-content {
            background-color: #1e3328;
            border: 4px solid #8B4513;
            border-radius: 8px;
            padding: 30px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            color: #fff;
        }

        .modal-content h2 {
            font-size: 2.2rem;
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .modal-content input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 4px;
            color: #fff;
            font-family: 'Nanum Pen Script', cursive;
            font-size: 1.4rem;
            outline: none;
        }

        .modal-content input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .modal-content button.submit-btn {
            width: 100%;
            padding: 8px;
            background-color: #2b3e32;
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 4px;
            font-family: 'Nanum Pen Script', cursive;
            font-size: 1.5rem;
            cursor: pointer;
            margin-top: 5px;
            transition: background 0.2s;
        }

        .modal-content button.submit-btn:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            background: none;
            border: none;
            color: #fff;
            font-size: 1.8rem;
            cursor: pointer;
            font-family: sans-serif;
        }

        /* 하단 분필 받침대 */
        .chalkboard-ledge {
            position: absolute;
            bottom: -15px;
            left: 5%;
            width: 90%;
            height: 12px;
            background-color: #65300e;
            border-radius: 2px;
            box-shadow: 0 5px 10px rgba(0,0,0,0.4);
        }

        .chalk {
            position: absolute;
            top: -7px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 7px;
            background-color: #f0f0f0;
            border-radius: 3px;
        }

        .eraser {
            position: absolute;
            top: -14px;
            right: 80px;
            width: 50px;
            height: 14px;
            background-color: #c29b68;
            border: 2px solid #8c673b;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <div class="blackboard-frame">
        <div class="center-content">
            <h1>삼치리</h1>
            <div class="auth-buttons">
                <button onclick="openModal('loginModal')">로그인</button>
                <button onclick="openModal('signupModal')">회원가입</button>
            </div>
        </div>

        <div class="chalkboard-ledge">
            <div class="chalk"></div>
            <div class="eraser"></div>
        </div>
    </div>

    <!-- 로그인 팝업 창 -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('loginModal')">&times;</button>
            <h2>로그인</h2>
            <input type="text" id="loginId" placeholder="아이디">
            <input type="password" id="loginPw" placeholder="비밀번호">
            <button class="submit-btn" onclick="handleLogin()">들어가기</button>
        </div>
    </div>

    <!-- 회원가입 팝업 창 -->
    <div id="signupModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('signupModal')">&times;</button>
            <h2>회원가입</h2>
            <input type="text" id="signupId" placeholder="사용할 아이디">
            <input type="password" id="signupPw" placeholder="비밀번호">
            <input type="text" id="signupName" placeholder="이름 (예: 평고 63회 김민수)">
            <button class="submit-btn" onclick="handleSignup()">가입하기</button>
        </div>
    </div>

    <script>
        // 팝업 열기
        function openModal(modalId) {
            document.getElementById(modalId).style.display = 'flex';
        }

        // 팝업 닫기
        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        // 회원가입 처리 (브라우저 저장소 사용)
        function handleSignup() {
            const id = document.getElementById('signupId').value.trim();
            const pw = document.getElementById('signupPw').value.trim();
            const name = document.getElementById('signupName').value.trim();

            if (!id || !pw || !name) {
                alert('모든 칸을 빈틈없이 채워주세요!');
                return;
            }

            // 기존 회원 목록 가져오기 또는 빈 배열 생성
            let users = JSON.parse(localStorage.getItem('samchiri_users') || '[]');
            
            // 아이디 중복 체크
            if (users.some(user => user.id === id)) {
                alert('이미 존재하는 아이디입니다!');
                return;
            }

            users.push({ id, pw, name });
            localStorage.setItem('samchiri_users', JSON.stringify(users));
            
            alert('삼치리 식구(+1)가 되신 걸 환영합니다! 로그인해 주세요.');
            closeModal('signupModal');
            document.getElementById('signupId').value = '';
            document.getElementById('signupPw').value = '';
            document.getElementById('signupName').value = '';
        }

        // 로그인 처리
        function handleLogin() {
            const id = document.getElementById('loginId').value.trim();
            const pw = document.getElementById('loginPw').value.trim();

            if (!id || !pw) {
                alert('아이디와 비밀번호를 입력해주세요!');
                return;
            }

            let users = JSON.parse(localStorage.getItem('samchiri_users') || '[]');
            const foundUser = users.find(user => user.id === id && user.pw === pw);

            if (foundUser) {
                alert(`반가워요, ${foundUser.name}님! 오늘도 삼치리에서 즐거운 시간 보내세요.`);
                localStorage.setItem('samchiri_login_user', JSON.stringify(foundUser));
                closeModal('loginModal');
                // 나중에 메인 화면이나 게시판으로 전환하는 코드를 여기에 추가할 수 있습니다.
            } else {
                alert('아이디나 비밀번호가 틀렸습니다. 다시 확인해 보세요!');
            }
        }
    </script>

</body>
</html>
