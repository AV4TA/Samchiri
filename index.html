<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>삼치리 - 평택고등학교 63회</title>
    <!-- 예쁜 분필/손글씨 폰트 불러오기 -->
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #2b3e32;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Nanum Pen Script', cursive, sans-serif;
        }

        /* 칠판 프레임 */
        .blackboard-frame {
            background-color: #1e3328;
            border: 12px solid #8B4513;
            border-radius: 6px;
            width: 94vw;
            max-width: 1000px;
            height: 85vh;
            max-height: 600px;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 0 50px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* 칠판 가루 질감 오버레이 */
        .blackboard-frame::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0.1) 100%);
            pointer-events: none;
        }

        /* 중앙 컨테이너 */
        .center-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            z-index: 1;
            width: 100%;
        }

        /* 분필로 칠판에 슥- 그려지는 느낌의 애니메이션 */
        .center-content h1 {
            font-size: clamp(5rem, 15vw, 9rem);
            color: #f7f9f6;
            font-weight: normal;
            /* 분필 특유의 번짐(글로우) 효과 */
            text-shadow: 
                0 0 2px rgba(255, 255, 255, 0.8),
                2px 2px 5px rgba(0, 0, 0, 0.5),
                0 0 15px rgba(255, 255, 255, 0.4);
            letter-spacing: 8px;
            margin-bottom: 25px;
            white-space: nowrap;
            
            /* 판서가 나타나는 애니메이션 (서서히 진해지면서 커짐) */
            opacity: 0;
            transform: scale(0.95);
            animation: chalkDraw 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes chalkDraw {
            0% {
                opacity: 0;
                transform: scale(0.9) translateY(10px);
                filter: blur(4px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: blur(0px);
            }
        }

        /* 로그인/회원가입 버튼 (판서가 끝난 뒤 자연스럽게 등장) */
        .auth-buttons {
            display: flex;
            gap: 15px;
            opacity: 0;
            animation: fadeIn 0.8s ease-in-out 0.8s forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-buttons a {
            color: #ffffff;
            text-decoration: none;
            font-size: clamp(1.2rem, 4vw, 1.5rem);
            border: 2px dashed rgba(255, 255, 255, 0.6); /* 분필로 대충 그은 듯한 느낌의 테두리 */
            padding: 6px 20px;
            border-radius: 6px;
            transition: all 0.2s;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
        }

        .auth-buttons a:hover {
            background-color: rgba(255, 255, 255, 0.15);
            border-style: solid;
        }

        /* 하단 분필 받침대 */
        .chalkboard-ledge {
            position: absolute;
            bottom: -15px;
            left: 5%;
            width: 90%;
            height: 12px;
            background-color: #65300e;
            border-radius: 2px;
            box-shadow: 0 5px 10px rgba(0,0,0,0.4);
        }

        .chalk {
            position: absolute;
            top: -7px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 7px;
            background-color: #f0f0f0;
            border-radius: 3px;
        }

        .eraser {
            position: absolute;
            top: -14px;
            right: 80px;
            width: 50px;
            height: 14px;
            background-color: #c29b68;
            border: 2px solid #8c673b;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <div class="blackboard-frame">
        <div class="center-content">
            <h1>삼치리</h1>
            <div class="auth-buttons">
                <a href="#login">로그인</a>
                <a href="#signup">회원가입</a>
            </div>
        </div>

        <div class="chalkboard-ledge">
            <div class="chalk"></div>
            <div class="eraser"></div>
        </div>
    </div>

</body>
</html>
