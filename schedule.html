<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모임 일정 - 삼치리</title>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #2b3e32;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Nanum Pen Script', cursive, sans-serif;
            padding: 10px;
        }

        .blackboard-frame {
            background-color: #1e3328;
            border: 10px solid #8B4513;
            border-radius: 6px;
            width: 100%;
            max-width: 1000px;
            /* 세로/가로 화면에서 잘리지 않고 유연하게 반응하도록 수정 */
            height: auto;
            min-height: 85vh;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 0 50px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            padding: 15px;
            color: #fff;
        }

        .blackboard-frame::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0.1) 100%);
            pointer-events: none;
        }

        /* 상단 헤더 */
        .sub-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed rgba(255,255,255,0.4);
            padding-bottom: 10px;
            margin-bottom: 12px;
            z-index: 1;
        }

        .sub-header h2 { font-size: 2rem; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        
        .back-btn {
            background: transparent;
            color: #fff;
            border: 1px solid #fff;
            padding: 3px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Nanum Pen Script', cursive;
            font-size: 1.2rem;
            text-decoration: none;
        }

        .back-btn:hover { background: rgba(255,255,255,0.1); }

        /* 타임트리 스타일 달력 컨테이너 */
        .calendar-container {
            display: flex;
            flex-direction: column;
            background: rgba(0,0,0,0.15);
            border-radius: 6px;
            padding: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 1;
        }

        .cal-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 1.5rem;
        }

        .cal-nav button {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.5);
            color: #fff;
            padding: 2px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Nanum Pen Script', cursive;
            font-size: 1.3rem;
        }

        .cal-nav button:hover { background: rgba(255,255,255,0.1); }

        /* 요일 헤더 */
        .cal-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 8px;
            color: #a0d8a0;
        }

        .cal-weekdays div:first-child { color: #ff9999; }
        .cal-weekdays div:last-child { color: #99ccff; }

        /* 날짜 그리드 */
        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .cal-day {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            padding: 4px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            font-size: 1.1rem;
            min-height: 75px;
            position: relative;
            cursor: pointer;
            transition: background 0.2s;
        }

        .cal-day:hover { background: rgba(255, 255, 255, 0.12); }
        .cal-day.other-month { color: rgba(255, 255, 255, 0.3); }

        .cal-event {
            background: rgba(255, 235, 150, 0.85);
            color: #2b3e32;
            font-size: 0.95rem;
            padding: 1px 4px;
            border-radius: 3px;
            margin-top: 2px;
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: bold;
        }

        /* 하단 분필 받침대 */
        .chalkboard-ledge {
            position: absolute; bottom: -12px; left: 5%; width: 90%; height: 10px;
            background-color: #65300e; border-radius: 2px; box-shadow: 0 5px 10px rgba(0,0,0,0.4);
        }
        .chalk { position: absolute; top: -6px; left: 50%; transform: translateX(-50%); width: 35px; height: 6px; background-color: #f0f0f0; border-radius: 3px; }
        .eraser { position: absolute; top: -12px; right: 70px; width: 45px; height: 12px; background-color: #c29b68; border: 2px solid #8c673b; border-radius: 2px; }
    </style>
</head>
<body>

    <div class="blackboard-frame">
        <div class="sub-header">
            <h2>📅 모임 일정</h2>
            <a href="index.html" class="back-btn">돌아가기</a>
        </div>

        <div class="calendar-container">
            <div class="cal-nav">
                <button onclick="changeMonth(-1)">◀ 이전</button>
                <span id="calMonthTitle">2026년 9월</span>
                <button onclick="changeMonth(1)">다음 ▶</button>
            </div>
            <div class="cal-weekdays">
                <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
            </div>
            <div id="calGrid" class="cal-grid"></div>
        </div>

        <div class="chalkboard-ledge">
            <div class="chalk"></div>
            <div class="eraser"></div>
        </div>
    </div>

    <script>
        window.onload = function() {
            const loginUser = JSON.parse(localStorage.getItem('samchiri_login_user'));
            if (!loginUser) {
                alert('로그인이 필요한 페이지입니다!');
                window.location.href = 'index.html';
                return;
            }
            renderCalendar();
        };

        let currentDate = new Date();

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            document.getElementById('calMonthTitle').innerText = `${year}년 ${month + 1}월`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const lastDay = new Date(year, month + 1, 0).getDate();
            const prevLastDay = new Date(year, month, 0).getDate();

            const grid = document.getElementById('calGrid');
            grid.innerHTML = '';

            // 저장된 일정 불러오기
            const savedEvents = JSON.parse(localStorage.getItem('samchiri_events') || '{}');

            // 지난달 빈 칸
            for (let i = firstDayIndex; i > 0; i--) {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'cal-day other-month';
                dayDiv.innerText = prevLastDay - i + 1;
                grid.appendChild(dayDiv);
            }

            // 이번달 날짜
            for (let i = 1; i <= lastDay; i++) {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'cal-day';
                
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                
                dayDiv.innerHTML = `<span>${i}</span>`;

                // 해당 날짜에 저장된 일정이 있으면 표시
                if (savedEvents[dateStr]) {
                    const eventDiv = document.createElement('div');
                    eventDiv.className = 'cal-event';
                    eventDiv.innerText = savedEvents[dateStr];
                    dayDiv.appendChild(eventDiv);
                }

                // 날짜 클릭 시 일정 추가 기능
                dayDiv.onclick = function() {
                    let eventText = prompt(`${year}년 ${month + 1}월 ${i}일에 추가할 일정을 적어주세요!\n(삭제하려면 내용을 비우고 확인을 누르세요)`);
                    if (eventText !== null) {
                        let events = JSON.parse(localStorage.getItem('samchiri_events') || '{}');
                        if (eventText.trim() === "") {
                            delete events[dateStr]; // 빈칸이면 삭제
                        } else {
                            events[dateStr] = eventText.trim();
                        }
                        localStorage.setItem('samchiri_events', JSON.stringify(events));
                        renderCalendar();
                    }
                };

                grid.appendChild(dayDiv);
            }
        }

        function changeMonth(direction) {
            currentDate.setMonth(currentDate.getMonth() + direction);
            renderCalendar();
        }
    </script>

</body>
</html>
