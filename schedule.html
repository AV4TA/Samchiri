<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모임 일정 - 삼치리</title>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #2b3e32;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Nanum Pen Script', cursive, sans-serif;
            padding: 10px;
        }

        .blackboard-frame {
            background-color: #1e3328;
            border: 12px solid #8B4513;
            border-radius: 8px;
            width: 100%;
            max-width: 1000px;
            min-height: 90vh;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 0 50px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            padding: 15px;
            color: #fff;
        }

        .blackboard-frame::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0.1) 100%);
            pointer-events: none;
        }

        .sub-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed rgba(255,255,255,0.3);
            padding-bottom: 10px;
            margin-bottom: 12px;
            z-index: 1;
        }

        .sub-header h2 { font-size: 2rem; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        
        .back-btn {
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.4);
            padding: 3px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Nanum Pen Script', cursive;
            font-size: 1.2rem;
            text-decoration: none;
        }
        .back-btn:hover { background: rgba(255,255,255,0.2); }

        .top-action-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 12px;
            z-index: 1;
        }

        .add-event-btn {
            background: rgba(160, 216, 160, 0.2);
            color: #a0d8a0;
            border: 1px dashed #a0d8a0;
            padding: 4px 14px;
            border-radius: 6px;
            font-family: 'Nanum Pen Script', cursive;
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .add-event-btn:hover {
            background: rgba(160, 216, 160, 0.35);
            color: #fff;
        }

        .calendar-container {
            display: flex;
            flex-direction: column;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            padding: 10px;
            border: 1px solid rgba(255,255,255,0.15);
            z-index: 1;
        }

        .cal-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 1.6rem;
        }

        .cal-nav button {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            padding: 2px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Nanum Pen Script', cursive;
            font-size: 1.3rem;
        }
        .cal-nav button:hover { background: rgba(255,255,255,0.1); }

        .cal-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 8px;
            color: #a0d8a0;
        }

        .cal-weekdays div:first-child { color: #ff9999; }
        .cal-weekdays div:last-child { color: #99ccff; }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .cal-day {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            padding: 4px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            font-size: 1.1rem;
            min-height: 110px;
            position: relative;
        }

        .cal-day.other-month { color: rgba(255, 255, 255, 0.25); }

        .cal-day.today {
            background: rgba(160, 216, 160, 0.08);
            border: 1.5px solid rgba(160, 216, 160, 0.6);
        }
        .cal-day.today .day-num {
            background: rgba(160, 216, 160, 0.3);
            color: #fff;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        .bar-container {
            display: flex;
            flex-direction: column;
            gap: 3px;
            width: 100%;
            margin-top: 3px;
            z-index: 2;
        }

        .schedule-bar {
            height: 22px;
            line-height: 22px;
            padding: 0 6px;
            font-size: 0.95rem;
            font-weight: bold;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0,0,0,0.3);
            transition: filter 0.2s;
        }
        .schedule-bar:hover { filter: brightness(1.15); }

        .schedule-bar.event {
            background: rgba(255, 230, 140, 0.95);
            color: #2b3e32;
        }

        .schedule-bar.poll {
            background: rgba(140, 210, 255, 0.95);
            color: #1e3328;
        }

        .bar-start { border-top-left-radius: 4px; border-bottom-left-radius: 4px; }
        .bar-end { border-top-right-radius: 4px; border-bottom-right-radius: 4px; }
        .bar-single { border-radius: 4px; }
        .bar-middle { border-radius: 0; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.65);
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 15px;
        }

        .modal-content {
            background-color: #1e3328;
            border: 4px solid #8B4513;
            border-radius: 10px;
            padding: 20px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            position: relative;
            box-shadow: 0 15px 30px rgba(0,0,0,0.6);
            color: #fff;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h2 { font-size: 2rem; margin-bottom: 12px; }
        .modal-content input, .modal-content select {
            width: 100%; padding: 8px 10px; margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.08); border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px; color: #fff; font-family: 'Nanum Pen Script', cursive; font-size: 1.3rem; outline: none;
        }
        .modal-content input::placeholder { color: rgba(255, 255, 255, 0.4); }
        .modal-content label { font-size: 1.3rem; display: block; text-align: left; margin-bottom: 3px; color: #a0d8a0; }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .modal-buttons button {
            flex: 1; padding: 7px; background-color: #2b3e32; color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.6); border-radius: 6px;
            font-family: 'Nanum Pen Script', cursive; font-size: 1.4rem; cursor: pointer;
        }
        .modal-buttons button.delete-btn { background-color: #9c3c3a; border-color: #d9534f; }

        .poll-item-box {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 8px;
            text-align: left;
        }
        .poll-btn {
            width: 100%;
            padding: 5px;
            margin-top: 5px;
            background: rgba(140, 210, 255, 0.2);
            border: 1px solid #8cd2ff;
            color: #fff;
            border-radius: 4px;
            font-family: 'Nanum Pen Script', cursive;
            font-size: 1.2rem;
            cursor: pointer;
        }
        .poll-btn:hover { background: rgba(140, 210, 255, 0.4); }

        .nolit-box {
            background: rgba(217, 83, 79, 0.15);
            border: 1px dashed #d9534f;
            border-radius: 6px;
            padding: 10px;
            margin-top: 10px;
            text-align: left;
        }

        .nudge-btn {
            width: 100%;
            margin-top: 6px;
            padding: 6px;
            background-color: #d9534f;
            border: none;
            color: white;
            border-radius: 4px;
            font-family: 'Nanum Pen Script', cursive;
            font-size: 1.2rem;
            cursor: pointer;
        }
        .nudge-btn:hover { background-color: #c9302c; }

        .close-btn {
            position: absolute; top: 10px; right: 15px; background: none; border: none;
            color: #fff; font-size: 1.6rem; cursor: pointer; font-family: sans-serif;
        }

        .chalkboard-ledge {
            position: absolute; bottom: -12px; left: 5%; width: 90%; height: 10px;
            background-color: #65300e; border-radius: 2px; box-shadow: 0 5px 10px rgba(0,0,0,0.4);
        }
        .chalk { position: absolute; top: -6px; left: 50%; transform: translateX(-50%); width: 35px; height: 6px; background-color: #f0f0f0; border-radius: 3px; }
        .eraser { position: absolute; top: -12px; right: 70px; width: 45px; height: 12px; background-color: #c29b68; border: 2px solid #8c673b; border-radius: 2px; }
    </style>
</head>
<body>

    <div class="blackboard-frame">
        <div class="sub-header">
            <h2>📅 모임 일정 & 투표</h2>
            <a href="index.html" class="back-btn">돌아가기</a>
        </div>

        <div class="top-action-bar">
            <button class="add-event-btn" onclick="openAddModal()">+ 일정/투표 등록하기</button>
        </div>

        <div class="calendar-container">
            <div class="cal-nav">
                <button onclick="changeMonth(-1)">◀ 이전</button>
                <span id="calMonthTitle"></span>
                <button onclick="changeMonth(1)">다음 ▶</button>
            </div>
            <div class="cal-weekdays">
                <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
            </div>
            <div id="calGrid" class="cal-grid"></div>
        </div>

        <div class="chalkboard-ledge">
            <div class="chalk"></div>
            <div class="eraser"></div>
        </div>
    </div>

    <div id="addModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('addModal')">&times;</button>
            <h2>새 일정 및 투표 등록</h2>
            
            <label>제목 / 내용</label>
            <input type="text" id="schedText" placeholder="예: 평고 63회 가을 여행">
            
            <label>시작일</label>
            <input type="date" id="schedStart">
            
            <label>종료일 (하루일 경우 시작일과 같게)</label>
            <input type="date" id="schedEnd">

            <div style="text-align: left; margin: 8px 0; font-size: 1.3rem;">
                <label style="display:inline;"><input type="checkbox" id="isPollCheck" onchange="togglePollBox()"> 📊 투표 함께 만들기</label>
            </div>

            <div id="pollBox" style="display: none;">
                <input type="text" id="pollOpt1" placeholder="선택지 1 (예: 참석)">
                <input type="text" id="pollOpt2" placeholder="선택지 2 (예: 불참)">
            </div>

            <div class="modal-buttons">
                <button class="submit-btn" onclick="saveSchedule()">등록하기</button>
            </div>
        </div>
    </div>

    <div id="detailModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('detailModal')">&times;</button>
            <h2 id="detailTitle">일정 상세</h2>
            <div id="detailBody" style="margin-bottom: 12px; font-size: 1.3rem; text-align: left;"></div>
            
            <div class="modal-buttons">
                <button class="delete-btn" onclick="deleteSchedule()">일정 삭제</button>
                <button class="submit-btn" onclick="closeModal('detailModal')">닫기</button>
            </div>
        </div>
    </div>

    <script>
        let loginUser = null;
        let currentEditingId = null;

        window.onload = function() {
            loginUser = JSON.parse(localStorage.getItem('samchiri_login_user'));
            if (!loginUser) {
                alert('로그인이 필요한 페이지입니다!');
                window.location.href = 'index.html';
                return;
            }
            renderCalendar();
            checkAndOpenUnvotedPoll();
        };

        function checkAndOpenUnvotedPoll() {
            const schedules = JSON.parse(localStorage.getItem('samchiri_schedules') || '[]');
            let unvotedPoll = schedules.find(item => {
                if (item.type !== 'poll') return false;
                let voted = false;
                Object.values(item.votes).forEach(arr => {
                    if (arr.includes(loginUser.name)) voted = true;
                });
                return !voted;
            });

            if (unvotedPoll) {
                openDetailModal(unvotedPoll.id);
            }
        }

        let currentDate = new Date();

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            document.getElementById('calMonthTitle').innerText = `${year}년 ${month + 1}월`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const lastDay = new Date(year, month + 1, 0).getDate();

            const grid = document.getElementById('calGrid');
            grid.innerHTML = '';

            const schedules = JSON.parse(localStorage.getItem('samchiri_schedules') || '[]');
            const today = new Date();
            const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;
            const todayDate = today.getDate();

            let daysData = [];

            for (let i = firstDayIndex; i > 0; i--) {
                let d = new Date(year, month, 1);
                d.setDate(d.getDate() - i);
                daysData.push({ dateStr: formatDate(d), dayNum: d.getDate(), isOther: true });
            }

            for (let i = 1; i <= lastDay; i++) {
                let dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                daysData.push({ dateStr: dateStr, dayNum: i, isOther: false, isToday: (isCurrentMonth && i === todayDate) });
            }

            let totalCells = Math.ceil(daysData.length / 7) * 7;
            let nextMonthDay = 1;
            while (daysData.length < totalCells) {
                let nextMonth = month + 1;
                let nextYear = year;
                if (nextMonth > 11) { nextMonth = 0; nextYear++; }
                let dateStr = `${nextYear}-${String(nextMonth + 1).padStart(2, '0')}-${String(nextMonthDay).padStart(2, '0')}`;
                daysData.push({ dateStr: dateStr, dayNum: nextMonthDay, isOther: true });
                nextMonthDay++;
            }

            daysData.forEach((dInfo, index) => {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'cal-day' + (dInfo.isOther ? ' other-month' : '') + (dInfo.isToday ? ' today' : '');
                
                dayDiv.innerHTML = `<span class="day-num">${dInfo.dayNum}</span>`;

                const barContainer = document.createElement('div');
                barContainer.className = 'bar-container';

                schedules.forEach(item => {
                    let dDate = new Date(dInfo.dateStr);

                    if (dInfo.dateStr >= item.start && dInfo.dateStr <= item.end) {
                        let dayOfWeek = index % 7; 
                        let isStartOfRange = (dInfo.dateStr === item.start);
                        let isFirstDayOfWeek = (dayOfWeek === 0);

                        if (isStartOfRange || isFirstDayOfWeek) {
                            const bar = document.createElement('div');
                            let typeClass = item.type === 'poll' ? 'poll' : 'event';
                            bar.className = `schedule-bar ${typeClass}`;

                            let currentSunday = new Date(dDate);
                            let daysToSaturday = 6 - dayOfWeek;
                            let currentSaturday = new Date(currentSunday);
                            currentSaturday.setDate(currentSaturday.getDate() + daysToSaturday);
                            let saturdayStr = formatDate(currentSaturday);

                            let actualEndInThisWeek = item.end < saturdayStr ? item.end : saturdayStr;
                            
                            let diffTime = new Date(actualEndInThisWeek) - new Date(dInfo.dateStr);
                            let diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24)) + 1;

                            bar.style.width = `calc(${diffDays * 100}% + ${(diffDays - 1) * 4}px)`;
                            bar.style.position = 'absolute';
                            bar.style.left = '4px';
                            bar.style.zIndex = '5';

                            if (isStartOfRange) bar.classList.add('bar-start');
                            else bar.classList.add('bar-middle');

                            if (actualEndInThisWeek === item.end) {
                                if (isStartOfRange) bar.classList.add('bar-single');
                                else bar.classList.add('bar-end');
                            }

                            if (item.type === 'poll') {
                                let totalVotes = 0;
                                if (item.votes) Object.values(item.votes).forEach(arr => totalVotes += arr.length);
                                
                                let voted = false;
                                Object.values(item.votes).forEach(arr => { if (arr.includes(loginUser.name)) voted = true; });
                                
                                bar.innerText = `${voted ? '📊' : '🔴 [미투표]'} ${item.text} (${totalVotes})`;
                            } else {
                                bar.innerText = item.text;
                            }

                            bar.onclick = (e) => {
                                e.stopPropagation();
                                openDetailModal(item.id);
                            };

                            barContainer.appendChild(bar);
                        }
                    }
                });

                dayDiv.appendChild(barContainer);
                grid.appendChild(dayDiv);
            });
        }

        function formatDate(d) {
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function changeMonth(direction) {
            currentDate.setMonth(currentDate.getMonth() + direction);
            renderCalendar();
        }

        function openAddModal() {
            document.getElementById('schedText').value = '';
            document.getElementById('schedStart').value = '';
            document.getElementById('schedEnd').value = '';
            document.getElementById('isPollCheck').checked = false;
            document.getElementById('pollBox').style.display = 'none';
            document.getElementById('pollOpt1').value = '';
            document.getElementById('pollOpt2').value = '';
            document.getElementById('addModal').style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function togglePollBox() {
            const isChecked = document.getElementById('isPollCheck').checked;
            document.getElementById('pollBox').style.display = isChecked ? 'block' : 'none';
        }

        function saveSchedule() {
            const text = document.getElementById('schedText').value.trim();
            const start = document.getElementById('schedStart').value;
            const end = document.getElementById('schedEnd').value || start;

            if (!text || !start) {
                alert('제목과 시작일을 모두 입력해주세요!');
                return;
            }
            if (end < start) {
                alert('종료일이 시작일보다 빠를 수 없습니다!');
                return;
            }

            let schedules = JSON.parse(localStorage.getItem('samchiri_schedules') || '[]');
            const isPoll = document.getElementById('isPollCheck').checked;

            let newEntry = {
                id: Date.now(),
                text: text,
                start: start,
                end: end,
                author: loginUser.name,
                type: isPoll ? 'poll' : 'event'
            };

            if (isPoll) {
                const opt1 = document.getElementById('pollOpt1').value.trim();
                const opt2 = document.getElementById('pollOpt2').value.trim();
                if (!opt1 || !opt2) {
                    alert('투표 선택지를 2개 모두 입력해주세요!');
                    return;
                }
                newEntry.options = [opt1, opt2];
                newEntry.votes = { 0: [], 1: [] };
            }

            schedules.push(newEntry);
            localStorage.setItem('samchiri_schedules', JSON.stringify(schedules));
            
            alert('일정이 성공적으로 등록되었습니다!');
            closeModal('addModal');
            renderCalendar();
        }

        function openDetailModal(id) {
            currentEditingId = id;
            let schedules = JSON.parse(localStorage.getItem('samchiri_schedules') || '[]');
            const item = schedules.find(s => s.id === id);
            if (!item) return;

            document.getElementById('detailTitle').innerText = item.type === 'poll' ? '📊 투표 참여하기' : '📅 일정 상세';
            
            let html = `<p><b>내용:</b> ${item.text}</p>`;
            html += `<p><b>기간:</b> ${item.start} ~ ${item.end}</p>`;
            html += `<p><b>작성자:</b> ${item.author}</p><hr style="border-color:rgba(255,255,255,0.2); margin:8px 0;">`;

            if (item.type === 'poll') {
                html += `<p style="margin-bottom:6px; color:#a0d8a0;"><b>[선택지 투표 현황]</b></p>`;
                
                let members = JSON.parse(localStorage.getItem('samchiri_members') || '["김민수", "박지호", "이민석", "이홍찬"]');
                if (!members.includes(loginUser.name)) members.push(loginUser.name);

                let votedNames = [];
                Object.values(item.votes).forEach(arr => votedNames.push(...arr));

                let unvotedNames = members.filter(m => !votedNames.includes(m));

                item.options.forEach((opt, idx) => {
                    let voters = item.votes[idx] || [];
                    html += `
                        <div class="poll-item-box">
                            <div><b>${opt}</b> (${voters.length}표)</div>
                            <div style="font-size:1rem; color:#ccc; margin:2px 0;">참여자: ${voters.length > 0 ? voters.join(', ') : '없음'}</div>
                            <button class="poll-btn" onclick="castVote(${item.id}, ${idx})">이 선택지로 투표/수정하기 👍</button>
                        </div>
                    `;
                });

                html += `
                    <div class="nolit-box">
                        <div style="color:#ff9999; font-weight:bold;">❌ 미투표자 (${unvotedNames.length}명)</div>
                        <div style="font-size:1rem; color:#eee; margin-top:2px;">${unvotedNames.length > 0 ? unvotedNames.join(', ') : '모두 투표 완료! 🎉'}</div>
                `;

                // 🔥 [핵심 수정] 로그인한 계정이 관리자(`loginUser.isAdmin`)일 때만 독촉 버튼이 보이도록 변경!
                if (loginUser.isAdmin) {
                    html += `
                        <button class="nudge-btn" onclick="sendNudgeAlert('${item.text}', '${unvotedNames.join(', ')}')">📢 미투표자들에게 독촉 알림 보내기</button>
                    `;
                }
                html += `</div>`;
            }

            document.getElementById('detailBody').innerHTML = html;
            document.getElementById('detailModal').style.display = 'flex';
        }

        function castVote(scheduleId, optIndex) {
            let schedules = JSON.parse(localStorage.getItem('samchiri_schedules') || '[]');
            let item = schedules.find(s => s.id === scheduleId);
            if (!item) return;

            let previouslyVotedOpt = -1;
            Object.keys(item.votes).forEach(key => {
                if (item.votes[key].includes(loginUser.name)) {
                    previouslyVotedOpt = parseInt(key);
                }
            });

            if (previouslyVotedOpt === optIndex) {
                alert('이미 이 선택지에 투표하셨습니다!');
                return;
            }

            Object.keys(item.votes).forEach(key => {
                item.votes[key] = item.votes[key].filter(name => name !== loginUser.name);
            });

            item.votes[optIndex].push(loginUser.name);

            localStorage.setItem('samchiri_schedules', JSON.stringify(schedules));
            
            if (previouslyVotedOpt !== -1) {
                alert('투표 내용이 수정되었습니다!');
            } else {
                alert('투표가 완료되었습니다!');
            }

            openDetailModal(scheduleId);
            renderCalendar();
        }

        function sendNudgeAlert(title, unvotedList) {
            alert(`[관리자 독촉 알림 전송 완료]\n\n"${title}" 투표를 안 한 친구들(${unvotedList})에게 독촉 메시지가 발송되었습니다!`);
        }

        function deleteSchedule() {
            if (confirm('이 일정을 삭제하시겠습니까?')) {
                let schedules = JSON.parse(localStorage.getItem('samchiri_schedules') || '[]');
                schedules = schedules.filter(s => s.id !== currentEditingId);
                localStorage.setItem('samchiri_schedules', JSON.stringify(schedules));
                alert('일정이 삭제되었습니다.');
                closeModal('detailModal');
                renderCalendar();
            }
        }
    </script>

</body>
</html>
