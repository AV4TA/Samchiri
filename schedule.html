<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모임 일정 - 삼치리</title>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #2b3e32;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Nanum Pen Script', cursive, sans-serif;
            padding: 10px;
        }

        .blackboard-frame {
            background-color: #1e3328;
            border: 10px solid #8B4513;
            border-radius: 6px;
            width: 100%;
            max-width: 1000px;
            height: auto;
            min-height: 85vh;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 0 50px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            padding: 15px;
            color: #fff;
        }

        .blackboard-frame::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0.1) 100%);
            pointer-events: none;
        }

        /* 상단 헤더 */
        .sub-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed rgba(255,255,255,0.4);
            padding-bottom: 10px;
            margin-bottom: 12px;
            z-index: 1;
        }

        .sub-header h2 { font-size: 2rem; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        
        .back-btn {
            background: transparent;
            color: #fff;
            border: 1px solid #fff;
            padding: 3px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Nanum Pen Script', cursive;
            font-size: 1.2rem;
            text-decoration: none;
        }

        .back-btn:hover { background: rgba(255,255,255,0.1); }

        /* 타임트리 스타일 달력 컨테이너 */
        .calendar-container {
            display: flex;
            flex-direction: column;
            background: rgba(0,0,0,0.15);
            border-radius: 6px;
            padding: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 1;
        }

        .cal-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 1.5rem;
        }

        .cal-nav button {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.5);
            color: #fff;
            padding: 2px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Nanum Pen Script', cursive;
            font-size: 1.3rem;
        }

        .cal-nav button:hover { background: rgba(255,255,255,0.1); }

        /* 요일 헤더 */
        .cal-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 8px;
            color: #a0d8a0;
        }

        .cal-weekdays div:first-child { color: #ff9999; }
        .cal-weekdays div:last-child { color: #99ccff; }

        /* 날짜 그리드 */
        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .cal-day {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            padding: 4px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            font-size: 1.1rem;
            min-height: 80px;
            position: relative;
            cursor: pointer;
            transition: background 0.2s;
        }

        .cal-day:hover { background: rgba(255, 255, 255, 0.12); }
        .cal-day.other-month { color: rgba(255, 255, 255, 0.3); }

        /* 오늘 날짜 강조 스타일 (분필 동그라미 느낌) */
        .cal-day.today {
            background: rgba(160, 216, 160, 0.15);
            border: 2px solid #a0d8a0;
        }
        .cal-day.today .day-num {
            background: #a0d8a0;
            color: #1e3328;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        .cal-event {
            background: rgba(255, 235, 150, 0.85);
            color: #2b3e32;
            font-size: 0.9rem;
            padding: 1px 4px;
            border-radius: 3px;
            margin-top: 2px;
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: bold;
        }

        .cal-poll {
            background: rgba(173, 216, 230, 0.85);
            color: #2b3e32;
            font-size: 0.85rem;
            padding: 1px 4px;
            border-radius: 3px;
            margin-top: 2px;
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 팝업 모달 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 15px;
        }

        .modal-content {
            background-color: #1e3328;
            border: 4px solid #8B4513;
            border-radius: 8px;
            padding: 25px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            color: #fff;
        }

        .modal-content h2 { font-size: 2rem; margin-bottom: 15px; }
        .modal-content input, .modal-content select {
            width: 100%; padding: 8px 10px; margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 4px; color: #fff; font-family: 'Nanum Pen Script', cursive; font-size: 1.3rem; outline: none;
        }
        .modal-content input::placeholder { color: rgba(255, 255, 255, 0.5); }
        
        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .modal-buttons button {
            flex: 1; padding: 8px; background-color: #2b3e32; color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.7); border-radius: 4px;
            font-family: 'Nanum Pen Script', cursive; font-size: 1.4rem; cursor: pointer;
        }
        .modal-buttons button.delete-btn { background-color: #a94442; border-color: #ebccd1; }

        .close-btn {
            position: absolute; top: 10px; right: 15px; background: none; border: none;
            color: #fff; font-size: 1.6rem; cursor: pointer; font-family: sans-serif;
        }

        /* 하단 분필 받침대 */
        .chalkboard-ledge {
            position: absolute; bottom: -12px; left: 5%; width: 90%; height: 10px;
            background-color: #65300e; border-radius: 2px; box-shadow: 0 5px 10px rgba(0,0,0,0.4);
        }
        .chalk { position: absolute; top: -6px; left: 50%; transform: translateX(-50%); width: 35px; height: 6px; background-color: #f0f0f0; border-radius: 3px; }
        .eraser { position: absolute; top: -12px; right: 70px; width: 45px; height: 12px; background-color: #c29b68; border: 2px solid #8c673b; border-radius: 2px; }
    </style>
</head>
<body>

    <div class="blackboard-frame">
        <div class="sub-header">
            <h2>📅 모임 일정 & 투표</h2>
            <a href="index.html" class="back-btn">돌아가기</a>
        </div>

        <div class="calendar-container">
            <div class="cal-nav">
                <button onclick="changeMonth(-1)">◀ 이전</button>
                <span id="calMonthTitle"></span>
                <button onclick="changeMonth(1)">다음 ▶</button>
            </div>
            <div class="cal-weekdays">
                <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
            </div>
            <div id="calGrid" class="cal-grid"></div>
        </div>

        <div class="chalkboard-ledge">
            <div class="chalk"></div>
            <div class="eraser"></div>
        </div>
    </div>

    <!-- 일정 및 투표 추가 팝업 모달 -->
    <div id="eventModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <h2 id="modalDateTitle">일정 추가</h2>
            <input type="text" id="eventText" placeholder="내용을 입력하세요 (예: 정기 모임)">
            
            <div style="text-align: left; margin-bottom: 12px; font-size: 1.2rem;">
                <label><input type="checkbox" id="isPollCheck" onchange="togglePollOptions()"> 📊 투표 기능 함께 열기</label>
            </div>

            <div id="pollOptionsBox" style="display: none;">
                <input type="text" id="pollOpt1" placeholder="투표 선택지 1 (예: 평택역)">
                <input type="text" id="pollOpt2" placeholder="투표 선택지 2 (예: 송탄)">
            </div>

            <div class="modal-buttons">
                <button class="delete-btn" id="deleteBtn" onclick="deleteEvent()" style="display:none;">삭제</button>
                <button class="submit-btn" onclick="saveEvent()">저장하기</button>
            </div>
        </div>
    </div>

    <script>
        let loginUser = null;
        let selectedDateStr = null;

        window.onload = function() {
            loginUser = JSON.parse(localStorage.getItem('samchiri_login_user'));
            if (!loginUser) {
                alert('로그인이 필요한 페이지입니다!');
                window.location.href = 'index.html';
                return;
            }
            renderCalendar();
        };

        let currentDate = new Date();

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            document.getElementById('calMonthTitle').innerText = `${year}년 ${month + 1}월`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const lastDay = new Date(year, month + 1, 0).getDate();
            const prevLastDay = new Date(year, month, 0).getDate();

            const grid = document.getElementById('calGrid');
            grid.innerHTML = '';

            const savedEvents = JSON.parse(localStorage.getItem('samchiri_events') || '{}');
            const today = new Date();
            const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;
            const todayDate = today.getDate();

            // 지난달 빈 칸
            for (let i = firstDayIndex; i > 0; i--) {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'cal-day other-month';
                dayDiv.innerHTML = `<span class="day-num">${prevLastDay - i + 1}</span>`;
                grid.appendChild(dayDiv);
            }

            // 이번달 날짜
            for (let i = 1; i <= lastDay; i++) {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'cal-day';
                
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                
                // 오늘 날짜 강조 클래스 부여
                if (isCurrentMonth && i === todayDate) {
                    dayDiv.classList.add('today');
                }

                dayDiv.innerHTML = `<span class="day-num">${i}</span>`;

                // 저장된 일정 또는 투표 표시
                if (savedEvents[dateStr]) {
                    const item = savedEvents[dateStr];
                    if (item.type === 'poll') {
                        const pollDiv = document.createElement('div');
                        pollDiv.className = 'cal-poll';
                        let totalVotes = 0;
                        if(item.votes) {
                            Object.values(item.votes).forEach(v => totalVotes += v.length);
                        }
                        pollDiv.innerText = `📊 [투표] ${item.text} (${totalVotes}표)`;
                        dayDiv.appendChild(pollDiv);
                    } else {
                        const eventDiv = document.createElement('div');
                        eventDiv.className = 'cal-event';
                        eventDiv.innerText = item.text;
                        dayDiv.appendChild(eventDiv);
                    }
                }

                // 날짜 클릭 시 팝업 열기
                dayDiv.onclick = function() {
                    openModal(dateStr, savedEvents[dateStr]);
                };

                grid.appendChild(dayDiv);
            }
        }

        function changeMonth(direction) {
            currentDate.setMonth(currentDate.getMonth() + direction);
            renderCalendar();
        }

        // 팝업 열기
        function openModal(dateStr, existingData) {
            selectedDateStr = dateStr;
            document.getElementById('modalDateTitle').innerText = `${dateStr} 일정`;
            document.getElementById('eventText').value = existingData ? existingData.text : '';
            
            const isPollCheck = document.getElementById('isPollCheck');
            const pollBox = document.getElementById('pollOptionsBox');
            const deleteBtn = document.getElementById('deleteBtn');

            if (existingData) {
                deleteBtn.style.display = 'block';
                if (existingData.type === 'poll') {
                    isPollCheck.checked = true;
                    pollBox.style.display = 'block';
                    document.getElementById('pollOpt1').value = existingData.options[0] || '';
                    document.getElementById('pollOpt2').value = existingData.options[1] || '';
                } else {
                    isPollCheck.checked = false;
                    pollBox.style.display = 'none';
                }
            } else {
                deleteBtn.style.display = 'none';
                isPollCheck.checked = false;
                pollBox.style.display = 'none';
                document.getElementById('eventText').value = '';
                document.getElementById('pollOpt1').value = '';
                document.getElementById('pollOpt2').value = '';
            }

            document.getElementById('eventModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('eventModal').style.display = 'none';
        }

        function togglePollOptions() {
            const isChecked = document.getElementById('isPollCheck').checked;
            document.getElementById('pollOptionsBox').style.display = isChecked ? 'block' : 'none';
        }

        // 일정 및 투표 저장
        function saveEvent() {
            const text = document.getElementById('eventText').value.trim();
            if (!text) {
                alert('내용을 입력해주세요!');
                return;
            }

            let events = JSON.parse(localStorage.getItem('samchiri_events') || '{}');
            const isPoll = document.getElementById('isPollCheck').checked;

            if (isPoll) {
                const opt1 = document.getElementById('pollOpt1').value.trim();
                const opt2 = document.getElementById('pollOpt2').value.trim();
                if (!opt1 || !opt2) {
                    alert('투표 선택지를 최소 2개 다 적어주세요!');
                    return;
                }
                events[selectedDateStr] = {
                    type: 'poll',
                    text: text,
                    options: [opt1, opt2],
                    votes: { 0: [], 1: [] }
                };
            } else {
                events[selectedDateStr] = {
                    type: 'event',
                    text: text
                };
            }

            localStorage.setItem('samchiri_events', JSON.stringify(events));
            closeModal();
            renderCalendar();
        }

        // 일정 삭제
        function deleteEvent() {
            if (confirm('이 일정을 삭제하시겠습니까?')) {
                let events = JSON.parse(localStorage.getItem('samchiri_events') || '{}');
                delete events[selectedDateStr];
                localStorage.setItem('samchiri_events', JSON.stringify(events));
                closeModal();
                renderCalendar();
            }
        }
    </script>

</body>
</html>
