<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모임 일정 - 삼치리</title>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #2b3e32;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Nanum Pen Script', cursive, sans-serif;
            padding: 10px;
        }

        .blackboard-frame {
            background-color: #1e3328;
            border: 10px solid #8B4513;
            border-radius: 6px;
            width: 100%;
            max-width: 1000px;
            height: auto;
            min-height: 85vh;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 0 50px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            padding: 15px;
            color: #fff;
        }

        .blackboard-frame::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0.1) 100%);
            pointer-events: none;
        }

        .sub-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed rgba(255,255,255,0.4);
            padding-bottom: 10px;
            margin-bottom: 12px;
            z-index: 1;
        }

        .sub-header h2 { font-size: 2rem; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        
        .back-btn {
            background: transparent;
            color: #fff;
            border: 1px solid #fff;
            padding: 3px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Nanum Pen Script', cursive;
            font-size: 1.2rem;
            text-decoration: none;
        }

        .back-btn:hover { background: rgba(255,255,255,0.1); }

        .calendar-container {
            display: flex;
            flex-direction: column;
            background: rgba(0,0,0,0.15);
            border-radius: 6px;
            padding: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 1;
        }

        .cal-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 1.5rem;
        }

        .cal-nav button {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.5);
            color: #fff;
            padding: 2px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Nanum Pen Script', cursive;
            font-size: 1.3rem;
        }

        .cal-nav button:hover { background: rgba(255,255,255,0.1); }

        .cal-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 8px;
            color: #a0d8a0;
        }

        .cal-weekdays div:first-child { color: #ff9999; }
        .cal-weekdays div:last-child { color: #99ccff; }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .cal-day {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            padding: 4px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            font-size: 1.1rem;
            min-height: 80px;
            position: relative;
            cursor: pointer;
            transition: background 0.2s;
        }

        .cal-day:hover { background: rgba(255, 255, 255, 0.12); }
        .cal-day.other-month { color: rgba(255, 255, 255, 0.3); }

        .cal-day.today {
            background: rgba(160, 216, 160, 0.15);
            border: 2px solid #a0d8a0;
        }
        .cal-day.today .day-num {
            background: #a0d8a0;
            color: #1e3328;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        /* 기간 일정 스타일 */
        .cal-event {
            background: rgba(255, 235, 150, 0.85);
            color: #2b3e32;
            font-size: 0.9rem;
            padding: 1px 4px;
            border-radius: 3px;
            margin-top: 2px;
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: bold;
        }

        .cal-poll {
            background: rgba(173, 216, 230, 0.85);
            color: #2b3e32;
            font-size: 0.85rem;
            padding: 1px 4px;
            border-radius: 3px;
            margin-top: 2px;
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 상단 우측에 새 일정 추가 버튼 배치 */
        .add-event-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
            z-index: 1;
        }
        .add-event-btn {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border: 1px solid #fff;
            padding: 4px 12px;
            border-radius: 4px;
            font-family: 'Nanum Pen Script', cursive;
            font-size: 1.3rem;
            cursor: pointer;
        }
        .add-event-btn:hover { background: rgba(255, 255, 255, 0.3); }

        /* 팝업 모달 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 15px;
        }

        .modal-content {
            background-color: #1e3328;
            border: 4px solid #8B4513;
            border-radius: 8px;
            padding: 25px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            color: #fff;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h2 { font-size: 2rem; margin-bottom: 15px; }
        .modal-content input, .modal-content select {
            width: 100%; padding: 8px 10px; margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 4px; color: #fff; font-family: 'Nanum Pen Script', cursive; font-size: 1.3rem; outline: none;
        }
        .modal-content input::placeholder { color: rgba(255, 255, 255, 0.5); }
        .modal-content label { font-size: 1.3rem; display: block; text-align: left; margin-bottom: 5px; color: #a0d8a0; }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .modal-buttons button {
            flex: 1; padding: 8px; background-color: #2b3e32; color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.7); border-radius: 4px;
            font-family: 'Nanum Pen Script', cursive; font-size: 1.4rem; cursor: pointer;
        }
        .modal-buttons button.delete-btn { background-color: #a94442; border-color: #ebccd1; }

        /* 투표 참여 리스트 스타일 */
        .poll-item-box {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px;
            padding: 10px;
            margin-bottom: 10px;
            text-align: left;
        }
        .poll-btn {
            width: 100%;
            padding: 6px;
            margin-top: 5px;
            background: rgba(173, 216, 230, 0.2);
            border: 1px solid #add8e6;
            color: #fff;
            border-radius: 4px;
            font-family: 'Nanum Pen Script', cursive;
            font-size: 1.2rem;
            cursor: pointer;
        }
        .poll-btn:hover { background: rgba(173, 216, 230, 0.4); }

        .close-btn {
            position: absolute; top: 10px; right: 15px; background: none; border: none;
            color: #fff; font-size: 1.6rem; cursor: pointer; font-family: sans-serif;
        }

        .chalkboard-ledge {
            position: absolute; bottom: -12px; left: 5%; width: 90%; height: 10px;
            background-color: #65300e; border-radius: 2px; box-shadow: 0 5px 10px rgba(0,0,0,0.4);
        }
        .chalk { position: absolute; top: -6px; left: 50%; transform: translateX(-50%); width: 35px; height: 6px; background-color: #f0f0f0; border-radius: 3px; }
        .eraser { position: absolute; top: -12px; right: 70px; width: 45px; height: 12px; background-color: #c29b68; border: 2px solid #8c673b; border-radius: 2px; }
    </style>
</head>
<body>

    <div class="blackboard-frame">
        <div class="sub-header">
            <h2>📅 모임 일정 & 투표</h2>
            <a href="index.html" class="back-btn">돌아가기</a>
        </div>

        <div class="add-event-bar">
            <button class="add-event-btn" onclick="openAddModal()">+ 일정/투표 등록</button>
        </div>

        <div class="calendar-container">
            <div class="cal-nav">
                <button onclick="changeMonth(-1)">◀ 이전</button>
                <span id="calMonthTitle"></span>
                <button onclick="changeMonth(1)">다음 ▶</button>
            </div>
            <div class="cal-weekdays">
                <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
            </div>
            <div id="calGrid" class="cal-grid"></div>
        </div>

        <div class="chalkboard-ledge">
            <div class="chalk"></div>
            <div class="eraser"></div>
        </div>
    </div>

    <!-- 일정/투표 추가 모달 -->
    <div id="addModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('addModal')">&times;</button>
            <h2>새 일정 및 투표 등록</h2>
            
            <label>제목 / 내용</label>
            <input type="text" id="schedText" placeholder="예: 평고 63회 가을 여행">
            
            <label>시작일</label>
            <input type="date" id="schedStart">
            
            <label>종료일 (하루일 경우 시작일과 같게)</label>
            <input type="date" id="schedEnd">

            <div style="text-align: left; margin: 10px 0; font-size: 1.3rem;">
                <label style="display:inline;"><input type="checkbox" id="isPollCheck" onchange="togglePollBox()"> 📊 투표 함께 만들기</label>
            </div>

            <div id="pollBox" style="display: none;">
                <input type="text" id="pollOpt1" placeholder="선택지 1 (예: 서울 강남)">
                <input type="text" id="pollOpt2" placeholder="선택지 2 (예: 평택 본토)">
            </div>

            <div class="modal-buttons">
                <button class="submit-btn" onclick="saveSchedule()">등록하기</button>
            </div>
        </div>
    </div>

    <!-- 투표 참여 및 상세 확인 모달 -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('detailModal')">&times;</button>
            <h2 id="detailTitle">일정 상세</h2>
            <div id="detailBody" style="margin-bottom: 15px; font-size: 1.4rem; text-align: left;"></div>
            
            <div class="modal-buttons">
                <button class="delete-btn" onclick="deleteSchedule()">일정 삭제</button>
                <button class="submit-btn" onclick="closeModal('detailModal')">닫기</button>
            </div>
        </div>
    </div>

    <script>
        let loginUser = null;
        let currentEditingId = null;

        window.onload = function() {
            loginUser = JSON.parse(localStorage.getItem('samchiri_login_user'));
            if (!loginUser) {
                alert('로그인이 필요한 페이지입니다!');
                window.location.href = 'index.html';
                return;
            }
            renderCalendar();
        };

        let currentDate = new Date();

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            document.getElementById('calMonthTitle').innerText = `${year}년 ${month + 1}월`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const lastDay = new Date(year, month + 1, 0).getDate();
            const prevLastDay = new Date(year, month, 0).getDate();

            const grid = document.getElementById('calGrid');
            grid.innerHTML = '';

            const schedules = JSON.parse(localStorage.getItem('samchiri_schedules') || '[]');
            const today = new Date();
            const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;
            const todayDate = today.getDate();

            // 지난달 빈 칸
            for (let i = firstDayIndex; i > 0; i--) {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'cal-day other-month';
                dayDiv.innerHTML = `<span class="day-num">${prevLastDay - i + 1}</span>`;
                grid.appendChild(dayDiv);
            }

            // 이번달 날짜
            for (let i = 1; i <= lastDay; i++) {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'cal-day';
                
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                
                if (isCurrentMonth && i === todayDate) {
                    dayDiv.classList.add('today');
                }

                dayDiv.innerHTML = `<span class="day-num">${i}</span>`;

                // 해당 날짜에 포함되는 일정/투표 찾기
                schedules.forEach(item => {
                    if (dateStr >= item.start && dateStr <= item.end) {
                        const div = document.createElement('div');
                        if (item.type === 'poll') {
                            div.className = 'cal-poll';
                            let totalVotes = 0;
                            if(item.votes) {
                                Object.values(item.votes).forEach(arr => totalVotes += arr.length);
                            }
                            div.innerText = `📊 ${item.text} (${totalVotes})`;
                        } else {
                            div.className = 'cal-event';
                            div.innerText = item.text;
                        }
                        
                        // 클릭 시 상세 보기 및 투표 참여 팝업
                        div.onclick = (e) => {
                            e.stopPropagation();
                            openDetailModal(item.id);
                        };
                        dayDiv.appendChild(div);
                    }
                });

                grid.appendChild(dayDiv);
            }
        }

        function changeMonth(direction) {
            currentDate.setMonth(currentDate.getMonth() + direction);
            renderCalendar();
        }

        function openAddModal() {
            document.getElementById('schedText').value = '';
            document.getElementById('schedStart').value = '';
            document.getElementById('schedEnd').value = '';
            document.getElementById('isPollCheck').checked = false;
            document.getElementById('pollBox').style.display = 'none';
            document.getElementById('pollOpt1').value = '';
            document.getElementById('pollOpt2').value = '';
            document.getElementById('addModal').style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function togglePollBox() {
            const isChecked = document.getElementById('isPollCheck').checked;
            document.getElementById('pollBox').style.display = isChecked ? 'block' : 'none';
        }

        // 일정 및 투표 저장 (기간 설정 지원)
        function saveSchedule() {
            const text = document.getElementById('schedText').value.trim();
            const start = document.getElementById('schedStart').value;
            const end = document.getElementById('schedEnd').value || start;

            if (!text || !start) {
                alert('제목과 시작일을 모두 입력해주세요!');
                return;
            }
            if (end < start) {
                alert('종료일이 시작일보다 빠를 수 없습니다!');
                return;
            }

            let schedules = JSON.parse(localStorage.getItem('samchiri_schedules') || '[]');
            const isPoll = document.getElementById('isPollCheck').checked;

            let newEntry = {
                id: Date.now(),
                text: text,
                start: start,
                end: end,
                author: loginUser.name,
                type: isPoll ? 'poll' : 'event'
            };

            if (isPoll) {
                const opt1 = document.getElementById('pollOpt1').value.trim();
                const opt2 = document.getElementById('pollOpt2').value.trim();
                if (!opt1 || !opt2) {
                    alert('투표 선택지를 2개 모두 입력해주세요!');
                    return;
                }
                newEntry.options = [opt1, opt2];
                newEntry.votes = { 0: [], 1: [] }; // index별 참여자 이름 배열
            }

            schedules.push(newEntry);
            localStorage.setItem('samchiri_schedules', JSON.stringify(schedules));
            closeModal('addModal');
            renderCalendar();
        }

        // 상세 및 투표 참여 팝업 열기
        function openDetailModal(id) {
            currentEditingId = id;
            let schedules = JSON.parse(localStorage.getItem('samchiri_schedules') || '[]');
            const item = schedules.find(s => s.id === id);
            if (!item) return;

            document.getElementById('detailTitle').innerText = item.type === 'poll' ? '📊 투표 참여하기' : '📅 일정 상세';
            
            let html = `<p><b>내용:</b> ${item.text}</p>`;
            html += `<p><b>기간:</b> ${item.start} ~ ${item.end}</p>`;
            html += `<p><b>작성자:</b> ${item.author}</p><hr style="border-color:rgba(255,255,255,0.2); margin:10px 0;">`;

            if (item.type === 'poll') {
                html += `<p style="margin-bottom:8px; color:#a0d8a0;"><b>[선택지 투표 현황]</b></p>`;
                
                item.options.forEach((opt, idx) => {
                    let voters = item.votes[idx] || [];
                    html += `
                        <div class="poll-item-box">
                            <div><b>${opt}</b> (${voters.length}표)</div>
                            <div style="font-size:1.1rem; color:#ccc; margin:3px 0;">참여자: ${voters.length > 0 ? voters.join(', ') : '없음'}</div>
                            <button class="poll-btn" onclick="castVote(${item.id}, ${idx})">이 선택지에 투표하기 👍</button>
                        </div>
                    `;
                });
            }

            document.getElementById('detailBody').innerHTML = html;
            document.getElementById('detailModal').style.display = 'flex';
        }

        // 투표 참여하기 실행
        function castVote(scheduleId, optIndex) {
            let schedules = JSON.parse(localStorage.getItem('samchiri_schedules') || '[]');
            let item = schedules.find(s => s.id === scheduleId);
            if (!item) return;

            // 이미 다른 곳에 투표했는지 확인 후 중복 제거 또는 이동
            Object.keys(item.votes).forEach(key => {
                item.votes[key] = item.votes[key].filter(name => name !== loginUser.name);
            });

            // 선택한 항목에 내 이름 추가
            item.votes[optIndex].push(loginUser.name);

            localStorage.setItem('samchiri_schedules', JSON.stringify(schedules));
            openDetailModal(scheduleId); // 팝업 새로고침
            renderCalendar(); // 달력 새로고침
        }

        // 일정 삭제
        function deleteSchedule() {
            if (confirm('이 일정을 삭제하시겠습니까?')) {
                let schedules = JSON.parse(localStorage.getItem('samchiri_schedules') || '[]');
                schedules = schedules.filter(s => s.id !== currentEditingId);
                localStorage.setItem('samchiri_schedules', JSON.stringify(schedules));
                closeModal('detailModal');
                renderCalendar();
            }
        }
    </script>

</body>
</html>
